[project]
name = "call-me-maybe"
version = "0.1.0"
description = "LLM Function Calling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "llm-sdk",
    "accelerate>=1.14.0",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "python-dotenv>=1.2.2",
]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk" }

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true
